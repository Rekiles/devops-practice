events { worker_connections 1024; }

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;

    server {
        listen 80;
        server_name localhost;

        # Роутинг на Flask-приложение
        location / {
            proxy_pass http://web:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # === НАСТРОЙКА БЕЗОПАСНОГО ПРОКСИРОВАНИЯ ПРОМЕТЕУСА ===
        location /prometheus/ {
            proxy_pass http://prometheus:9090/prometheus/; # Слэш на конце важен!
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Роутинг на Grafana
        location /grafana/ {
            proxy_pass http://grafana:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Nginx Healthcheck (задача из твоего среднего приоритета)
        location /health {
            stub_status;
            allow 127.0.0.1;
            allow 10.5.0.0/24; # Доступ для внутренней сети Яндекса
            deny all;
        }
    }
}