global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    # Так как мы добавили префикс пути, метрики самого Прометеуса переехали
    metrics_path: '/prometheus/metrics'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      # Так как node-exporter запущен в network_mode: host, контейнер Прометеуса 
      # не видит его по имени сервиса. Стучимся к нему через стандартный шлюз Docker-сети.
      - targets: ['172.17.0.1:9100']

  - job_name: 'flask-app'
    metrics_path: '/metrics'
    static_configs:
      # Имя 'web' совпадает со службой Flask в твоем docker-compose.yml
      - targets: ['web:5000']