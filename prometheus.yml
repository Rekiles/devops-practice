global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    # Внутри самого контейнера Прометеус слушает метрики по стандартному пути
    metrics_path: '/metrics'
    static_configs:
      # Опрашиваем по внутреннему DNS имени Docker-сети
      - targets: ['prometheus:9090']

  - job_name: 'node-exporter'
    metrics_path: '/metrics'
    static_configs:
      # Так как node-exporter в режиме host, стучимся к нему через шлюз Docker-сети
      - targets: ['172.17.0.1:9100']

  - job_name: 'flask-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['web:5000']