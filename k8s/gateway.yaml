apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main-gateway
  namespace: default
spec:
  gatewayClassName: traefik
  listeners:
    # HTTP listener для cert-manager challenges и редиректов
    - name: web
      protocol: HTTP
      port: 80
      hostname: "*"  # Принимаем любые входящие хосты, маршруты разберутся сами
      allowedRoutes:
        namespaces:
          from: All
    
    # HTTPS listener для всех доменов
    - name: websecure
      protocol: HTTPS
      port: 443
      hostname: "*"  # Корректно принимает и reshort.duckdns.org, и grafana.reshort.duckdns.org
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: flask-grafana-tls-secret