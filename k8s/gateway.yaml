apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main-gateway
  namespace: default
spec:
  gatewayClassName: traefik
  listeners:
    # HTTP listener для cert-manager challenges
    - name: web
      protocol: HTTP
      port: 80
      hostname: "*.duckdns.org"  # Принимаем все домены на 80 порту
      allowedRoutes:
        namespaces:
          from: All
    
    # ЕДИНЫЙ HTTPS listener для всех доменов (нельзя создавать несколько на одном порту!)
    - name: websecure
      protocol: HTTPS
      port: 443
      hostname: "*.duckdns.org"  # Один listener на все поддомены
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: flask-grafana-tls-secret