apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main-gateway
  namespace: default
spec:
  gatewayClassName: traefik
  listeners:
    # 1. HTTP-слушатель (порт 80)
    - name: web
      protocol: HTTP
      port: 80
      # Поле hostname удалено, теперь этот порт открыт для любых доменов (Flask, Grafana, Cert-Manager)
      allowedRoutes:
        namespaces:
          from: All

    # 2. HTTPS-слушатель (порт 443)
    - name: websecure
      protocol: HTTPS
      port: 443
      # Поле hostname удалено для сквозного прохода всех TLS-маршрутов
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: flask-grafana-tls-secret