apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main-gateway
  namespace: default
spec:
  gatewayClassName: traefik
  listeners:
    # 1. HTTP-слушатель (порт 80) — теперь он явно принимает любые хосты
    - name: web
      protocol: HTTP
      port: 80
      hostname: "*" # <--- ДОБАВЛЕНО: Разрешает любые поддомены (включая cert-manager и grafana)
      allowedRoutes:
        namespaces:
          from: All

    # 2. HTTPS-слушатель (порт 443)
    - name: websecure
      protocol: HTTPS
      port: 443
      hostname: "*" # <--- ДОБАВЛЕНО для симметрии, чтобы HTTPS роуты тоже не блокировались
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: flask-grafana-tls-secret