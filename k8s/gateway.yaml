apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main-gateway
  namespace: default
spec:
  gatewayClassName: traefik
  listeners:
    # === HTTP (Порт 80) — Валидация для Let's Encrypt и редиректов ===
    - name: web-main
      protocol: HTTP
      port: 80
      hostname: "reshort.duckdns.org"
      allowedRoutes:
        namespaces:
          from: All

    - name: web-grafana
      protocol: HTTP
      port: 80
      hostname: "grafana.reshort.duckdns.org"
      allowedRoutes:
        namespaces:
          from: All

    # === HTTPS (Порт 443) — Твой защищенный трафик ===
    - name: websecure-main
      protocol: HTTPS
      port: 443
      hostname: "reshort.duckdns.org"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: flask-grafana-tls-secret

    - name: websecure-grafana
      protocol: HTTPS
      port: 443
      hostname: "grafana.reshort.duckdns.org"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: flask-grafana-tls-secret