apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |
    ports:
      web:
        port: 80
        expose:
          default: true
      websecure:
        port: 443
        expose:
          default: true
    providers:
      kubernetesGateway:
        enabled: true
    # Важно: для работы Gateway API с несколькими hostname
    experimental:
      plugins: {}