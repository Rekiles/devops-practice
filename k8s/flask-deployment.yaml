apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask
          image: docker.io/rekiles/flask-app:latest  # Четкое совпадение с пайплайном!
          imagePullPolicy: Always                     # Обязательно скачиваем свежий образ с Docker Hub
          env:
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_NAME
              value: "links_db"
            - name: DB_USER
              value: "postgres"
            - name: FLASK_ENV
              value: "production"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
          ports:
            - containerPort: 5000