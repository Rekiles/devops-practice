apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
  namespace: default
spec:
  parentRefs:
    - name: main-gateway # Привязываемся к тем же общим воротам кластера
  hostnames:
    - "grafana.reshort.duckdns.org" # Кастомный поддомен для твоей панели мониторинга
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: grafana-service # Указываем на существующий сервис Графаны
          port: 3000            # Порт, на котором работает Графана внутри сервиса