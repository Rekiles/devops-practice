apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
  namespace: default
spec:
  parentRefs:
    - name: main-gateway
  hostnames:
    - "reshort.duckdns.org"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /grafana # <--- ТЕПЕРЬ ТРАФИК ИДЕТ СЮДА
      backendRefs:
        - name: grafana
          port: 80