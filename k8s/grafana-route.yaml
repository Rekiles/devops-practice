apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
  namespace: default
spec:
  parentRefs:
    - name: main-gateway
      sectionName: web-grafana # Ссылка на слушатель Графаны
  hostnames:
    - "grafana.reshort.duckdns.org" # ИСПРАВЛЕНО: Был основной домен
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: / # ИСПРАВЛЕНО: Графана по умолчанию ждет корень
      backendRefs:
        - name: grafana-service # ИСПРАВЛЕНО: Было просто grafana
          port: 3000 # ИСПРАВЛЕНО: Был порт 80