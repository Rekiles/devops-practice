apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
  namespace: default
spec:
  parentRefs:
    - name: main-gateway
  hostnames:
    - "grafana.reshort.duckdns.org" # Теперь красиво живет на своем поддомене
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: grafana-service # ИСПРАВЛЕНО: Имя сервиса из grafana-monitoring.yaml
          port: 3000            # ИСПРАВЛЕНО: Порт Grafana вместо 80