apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flask-app-route
  namespace: default
spec:
  parentRefs:
    - name: main-gateway
      sectionName: websecure  # Привязываем к HTTPS listener
  hostnames:
    - "reshort.duckdns.org"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: flask-service
          port: 5000