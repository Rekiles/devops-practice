apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flask-app-route
  namespace: default
spec:
  parentRefs:
    - name: main-gateway
  hostnames:
    - "reshort.duckdns.org"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: / # Traefik v3 автоматически отдаст приоритет более длинным путям вроде /.well-known/
      backendRefs:
        - name: flask-app-service
          port: 5000