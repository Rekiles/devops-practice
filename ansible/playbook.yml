---
- name: Подготовка сервера и деплой проекта с мониторингом
  hosts: webservers
  become: yes

  tasks:
    # --- НАСТРОЙКА РЕПОЗИТОРИЯ DOCKER ---
    - name: Создать директорию для GPG-ключей apt
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Скачать официальный GPG-ключ Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Добавить официальный репозиторий Docker и обновить кэш apt
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
        state: present
        filename: docker
        update_cache: yes

    # --- УСТАНОВКА КОМПОНЕНТОВ ---
    - name: Установить Docker Engine, CLI и плагины
      ansible.builtin.apt:
        pkg:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Убедиться, что служба Docker запущена и добавлена в автозагрузку
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    # --- ОЧИСТКА СТАРЫХ ОШИБОК МОНТИРОВАНИЯ ---
    - name: Удалить ошибочно созданные директории конфигураций (если они стали папками)
      ansible.builtin.file:
        path: "/home/ubuntu/app/{{ item }}"
        state: absent
      loop:
        - prometheus.yml
        - promtail-config.yml

    # --- ДЕПЛОЙ ПРИЛОЖЕНИЯ И КОНФИГУРАЦИЙ ---
    - name: Создать рабочую папку для проекта на сервере
      ansible.builtin.file:
        path: /home/ubuntu/app
        state: directory
        mode: '0755'
        owner: ubuntu
        group: ubuntu

    - name: Скопировать файлы приложения и docker-compose на сервер
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: '0644'
        owner: ubuntu
        group: ubuntu
      loop:
        - { src: '../docker-compose.yml', dest: '/home/ubuntu/app/docker-compose.yml' }
        - { src: '../.env', dest: '/home/ubuntu/app/.env' }
        - { src: '../app/', dest: '/home/ubuntu/app/app/' }

    - name: Копировать конфигурации мониторинга на сервер (как файлы!)
      ansible.builtin.copy:
        src: "../{{ item }}"
        dest: "/home/ubuntu/app/{{ item }}"
        mode: '0644'
        owner: ubuntu
        group: ubuntu
      loop:
        - prometheus.yml
        - promtail-config.yml
        - nginx.conf

    # --- ЗАПУСК ИНФРАСТРУКТУРЫ ---
    - name: Запустить весь проект через Docker Compose (Идемпотентно)
      community.docker.docker_compose_v2:
        project_src: /home/ubuntu/app
        state: present
        build: always

    - name: Запустить Node Exporter для сбора системных метрик хоста
      community.docker.docker_container:
        name: node-exporter
        image: prom/node-exporter:latest
        restart_policy: unless-stopped
        network_mode: host
        pid_mode: host
        volumes:
          - /:/host:ro,rslave
        command:
          - '--path.rootfs=/host'