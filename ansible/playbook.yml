---
- name: Подготовка сервера и установка Docker
  hosts: webservers
  become: yes

  tasks:
    # --- НАСТРОЙКА РЕПОЗИТОРИЯ DOCKER ---
    - name: Создать директорию для GPG-ключей apt
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Скачать официальный GPG-ключ Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Добавить официальный репозиторий Docker и обновить кэш apt
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
        state: present
        filename: docker
        update_cache: yes # <-- ГАРАНТИРУЕТ, что apt увидит новые пакеты

    # --- УСТАНОВКА КОМПОНЕНТОВ ---
    - name: Установить Docker Engine, CLI и плагины
      ansible.builtin.apt:
        pkg:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Убедиться, что служба Docker запущена и добавлена в автозагрузку
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    # --- ДЕПЛОЙ ПРИЛОЖЕНИЯ ---
    - name: Создать рабочую папку для проекта на сервере
      ansible.builtin.file:
        path: /home/ubuntu/app
        state: directory
        mode: '0755'
        owner: ubuntu
        group: ubuntu

    - name: Скопировать файлы приложения и docker-compose на сервер
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: '0644'
      loop:
        - { src: '../docker-compose.yml', dest: '/home/ubuntu/app/docker-compose.yml' }
        - { src: '../.env', dest: '/home/ubuntu/app/.env' }
        - { src: '../app/', dest: '/home/ubuntu/app/app/' }

    # ---ПРОФЕССИОНАЛЬНЫЙ ЗАПУСК КОНТЕЙНЕРОВ ---
    - name: Запустить проект через Docker Compose (Идемпотентно)
      community.docker.docker_compose_v2:
        project_src: /home/ubuntu/app
        state: present
        build: always # <-- Соберет образы, если изменился Dockerfile/код
    - name: Запустить Node Exporter для сбора системных метрик
      community.docker.docker_container:
        name: node-exporter
        image: prom/node-exporter:latest
        restart_policy: unless-stopped
        network_mode: host
        pid_mode: host
        volumes:
          - /:/host:ro,rslave
        command:
          - '--path.rootfs=/host'
    - name: Создать папку для конфигурации Promtail
      ansible.builtin.file:
        path: /home/ubuntu/promtail
        state: directory
        mode: '0755'

    - name: Создать конфигурационный файл для Promtail
      ansible.builtin.copy:
        dest: /home/ubuntu/promtail/promtail.yml
        content: |
          server:
            http_listen_port: 9080
            grpc_listen_port: 0

          positions:
            filename: /tmp/positions.yaml

          clients:
            - url: http://localhost:3100/loki/api/v1/push

          scrape_configs:
            - job_name: docker_logs
              docker_sd_configs:
                - host: unix:///var/run/docker.sock
                  refresh_interval: 5s
              relabel_configs:
                - source_labels: ['__meta_docker_container_name']
                  regex: '/(.*)'
                  target_label: 'container'

    - name: Запустить Promtail в Docker для сбора логов контейнеров
      community.docker.docker_container:
        name: promtail
        image: grafana/promtail:latest
        restart_policy: unless-stopped
        network_mode: host
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
          - /var/lib/docker/containers:/var/lib/docker/containers:ro
          - /home/ubuntu/promtail/promtail.yml:/etc/promtail/config.yml
        command:
          - '-config.file=/etc/promtail/config.yml'