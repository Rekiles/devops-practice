name: Flask K8s CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем свежий код из репозитория
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Логинимся в Docker Hub с помощью сохраненных секретов
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 3. Собираем свежий Docker-образ и пушим его в Docker Hub
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./app
        file: ./app/Dockerfile
        push: true
        # ЗАМЕНИ "твой_логин" на реальный логин Docker Hub ниже:
        tags: Rekiles/flask-app:latest

    # 4. Настраиваем SSH-ключ для подключения к нашей работающей Ubuntu
    - name: Set up SSH Key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

    # 5. Подключаемся к серверу и даем команду Кубернетесу обновить приложение
    - name: Deploy to Kubernetes via SSH
      run: |
        ssh -i ~/.ssh/id_ed25519 ubuntu@${{ secrets.SERVER_IP }} << 'EOF'
          cd ~/k8s-project
          # Стягиваем изменения манифестов, если они были
          git pull origin main
          # Накатываем манифесты (на случай изменений в сервисах/деплоях)
          kubectl apply -f k8s/
          # Принудительно заставляем Flask скачать новый образ и перезапустить поды
          kubectl rollout restart deployment flask-deployment
        EOF